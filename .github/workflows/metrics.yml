name: Metrics
on:
  # Schedule daily updates at midnight
  schedule:
    - cron: "0 0 * * *"
  # Allow manual runs
  workflow_dispatch:
  # Run on push to main branch
  push:
    branches:
      - master
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Generate Stats Card
      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=Felix-au&show_icons=true&theme=nord&count_private=true'
          path: github-stats.svg
          token: ${{ secrets.METRICS_TOKEN }}

      # Generate Top Languages Card
      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: 'username=Felix-au&layout=compact&theme=nord&count_private=true'
          path: github-top-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}

      # Commit the generated SVGs
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg github-top-langs.svg
          git commit -m "Update README cards" || exit 0
          git push
