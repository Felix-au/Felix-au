<svg width="350" height="280" viewBox="0 0 350 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 18px 'Segoe UI', Ubuntu, sans-serif; fill: #88c0d0; }
    .lang-name { font: bold 12px 'Segoe UI', Ubuntu, sans-serif; fill: #d8dee9; }
    .lang-percent { font: 12px 'Segoe UI', Ubuntu, sans-serif; fill: #e5e9f0; }
  </style>
  <rect width="348" height="278" x="1" y="1" rx="5" fill="#2e3440" stroke="#3b4252" stroke-width="2"/>
  <text x="25" y="35" class="title">Most Used Languages</text>
  
  <svg x="25" y="55" width="300" height="12">
    <rect width="300" height="12" rx="6" fill="#3b4252"/>
    <clipPath id="bar-clip">
      <rect width="300" height="12" rx="6" />
    </clipPath>
    <g clip-path="url(#bar-clip)">
      <rect x="0.0" width="111.1" height="12" fill="#b07219" />
<rect x="111.1" width="107.8" height="12" fill="#3178c6" />
<rect x="219.0" width="40.2" height="12" fill="#f1e05a" />
<rect x="259.1" width="17.6" height="12" fill="#3572A5" />
<rect x="276.7" width="17.0" height="12" fill="#663399" />
<rect x="293.7" width="5.9" height="12" fill="#e34c26" />

    </g>
  </svg>
  
  <g transform="translate(25, 90)">
    
    <g transform="translate(0, 0)">
      <circle cx="5" cy="6" r="5" fill="#b07219" />
      <text x="18" y="10" class="lang-name">Java <tspan class="lang-percent">37.05%</tspan></text>
    </g>
    <g transform="translate(160, 0)">
      <circle cx="5" cy="6" r="5" fill="#3178c6" />
      <text x="18" y="10" class="lang-name">TypeScript <tspan class="lang-percent">35.94%</tspan></text>
    </g>
    <g transform="translate(0, 25)">
      <circle cx="5" cy="6" r="5" fill="#f1e05a" />
      <text x="18" y="10" class="lang-name">JavaScript <tspan class="lang-percent">13.39%</tspan></text>
    </g>
    <g transform="translate(160, 25)">
      <circle cx="5" cy="6" r="5" fill="#3572A5" />
      <text x="18" y="10" class="lang-name">Python <tspan class="lang-percent">5.87%</tspan></text>
    </g>
    <g transform="translate(0, 50)">
      <circle cx="5" cy="6" r="5" fill="#663399" />
      <text x="18" y="10" class="lang-name">CSS <tspan class="lang-percent">5.67%</tspan></text>
    </g>
    <g transform="translate(160, 50)">
      <circle cx="5" cy="6" r="5" fill="#e34c26" />
      <text x="18" y="10" class="lang-name">HTML <tspan class="lang-percent">1.96%</tspan></text>
    </g>
  </g>
</svg>