name: Metrics
on:
  # Schedule daily updates at midnight
  schedule:
    - cron: "0 */6 * * *"
  # Allow manual runs
  workflow_dispatch:
  # Run on push to main branch
  push:
    branches:
      - master
      - main
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Generate Custom Widgets
      - name: Generate custom widgets
        run: node generate-widgets.js
        env:
          PRIMARY_TOKEN: ${{ secrets.METRICS_TOKEN }}
          PRIMARY_USER: Felix-au

      # Commit the generated SVGs
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg
          git commit -m "Update README cards" || exit 0
          git push
